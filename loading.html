<!DOCTYPE html>

    <link rel="icon" type="image/svg+xml" href="public/imgs/icons/steam-xp.svg">

<body>

        <h1>Steam <sup>XP</sup></h1>

        </div>

        setTimeout(function () {
            window.location.href = "./desktop.html"
        }, 3000)
    </script>
</body>

</html>
